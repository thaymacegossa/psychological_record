<h3>Cadastro de Paciente</h3>
<form>
    <h4>Identificação Pessoal</h4>
    Nome: <input type="text" name="nome"><br>
    Data de nascimento: <input type="date" name="nascimento"><br>
    Idade atual: <input type="int" name="idade"><br>
    Gênero:
    <select>
        <option>Feminino</option>
        <option>Masculino</option>
        <option>Não-binário</option>
        <option>Prefere não declarar</option>
    </select><br>
    CPF: <input type="text" name="cpf" placeholder="123.456.789-00"><br>
    Estado civil: <select>
        <option>Solteiro (a)</option>
        <option>Casado (a)</option>
        <option>Divorciado (a)</option>
        <option>Viúvo (a)</option>
    </select><br>
    Grau de instrução: <input type="text" name="formação"><br>
    Profissão: <input type="text" name="profissao"><br>
    Contato: <input type="tel" name="telefone" placeholder="(99) 99999-9999"><br>
    Email: <input type="text" name="email"><br>
   
    <h4>Endereço</h4>
    Endereço:<input type="text" name="endereço"><br>
    Bairro: <input type="text" name="bairro"><br>
    Cidade: <input type="text" name="cidade"><br>
    Estado: <input type="text" name="estado"><br>
    País: <input type="text" name="pais"><br>
    
    <h4>Identificação do responsável</h4>
    Nome:<input type="text" name="nome"><br>
    Grau de parentesco: <input type="text" name="parentesco"><br>
    Contato de Emergência:<input type="tel" name="telefone" placeholder="(99) 99999-9999"><br>
    Email:<input type="text" name="email"><br>
    
</form>
